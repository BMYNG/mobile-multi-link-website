<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>법의모든영역 법모영</title>

    <style>
        :root {
            /* 스타벅스 특유의 톤앤매너 완벽 재현 */
            --bg-color: #f6f5f0;           /* 바닥 배경 */
            --card-bg: #f2ebd9;           /* 카드 배경 (조금 더 명확한 베이지) */
            --card-border: rgba(0, 0, 0, 0.04);
            --text-main: #222222;
            --text-sub: #666666;
            --event-tag: #8c5a2b;          /* 이벤트 브라운 컬러 */
            --sb-green: #00704a;
            --badge-green: #00704a;
            --border-color: #e5e3dc;
            
            /* 명암 및 윤곽을 결정짓는 핵심 그림자 */
            --shadow-card: 0 8px 20px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.04);
            --shadow-badge: 0 4px 10px rgba(0, 0, 0, 0.2);
            --shadow-img: 0 4px 12px rgba(0, 0, 0, 0.08);

            --radius-lg: 20px;
            --radius-sm: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 95px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            padding: 0 18px;
        }

        /* 1. 상단 앱 헤더 */
        .app-header {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            z-index: 100;
            padding: 24px 4px 16px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.6px;
        }

        /* 섹션 타이틀 */
        .section-header {
            margin: 20px 0 14px 4px;
        }

        .section-title {
            font-size: 19px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .section-subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 4px;
            font-weight: 500;
        }

        /* 2. 카드 리스트 - 입체감 핵심 설정 */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 22px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            position: relative;
            
            /* 명암과 윤곽을 선명하게 잡아주는 요소 */
            box-shadow: var(--shadow-card);
            border: 1px solid var(--card-border);
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s ease;
        }

        .link-card:active {
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
        }

        .card-content {
            flex: 1;
            padding-right: 14px;
        }

        .card-event-tag {
            font-size: 11px;
            font-weight: 800;
            color: var(--event-tag);
            letter-spacing: 0.6px;
            margin-bottom: 8px;
            display: block;
        }

        .card-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.4;
            word-break: keep-all;
            letter-spacing: -0.3px;
        }

        .card-title strong {
            color: var(--event-tag);
            font-weight: 800;
        }

        .card-date {
            font-size: 11px;
            color: #9e9382;
            margin-top: 10px;
            font-weight: 500;
        }

        /* 3. 오른쪽 이미지 & 3D 입체 뱃지 */
        .card-img-wrap {
            position: relative;
            width: 105px;
            height: 105px;
            flex-shrink: 0;
        }

        .card-img {
            width: 100%;
            height: 100%;
            border-radius: var(--radius-sm);
            object-fit: cover;
            background-color: #e2dbce;
            box-shadow: var(--shadow-img);
        }

        /* 스타벅스 특유의 둥근 입체 뱃지 */
        .img-badge {
            position: absolute;
            bottom: -6px;
            right: -6px;
            background-color: var(--badge-green);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-badge);
            line-height: 1;
            white-space: nowrap;
            border: 2px solid #ffffff; /* 하얀 테두리로 명암 분리 */
        }

        /* 4. 하단 네비게이션 바 세련미 개선 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 max(12px, env(safe-area-inset-bottom));
            z-index: 200;
            max-width: 430px;
            margin: 0 auto;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.03);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #8e8e93;
            font-size: 10px;
            font-weight: 600;
            width: 20%;
        }

        .nav-item.active {
            color: var(--sb-green);
            font-weight: 700;
        }

        .nav-icon-svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 11px;
            color: #a09d96;
            font-weight: 500;
        }
    </style>
</head>
<body>

    </main>

        © 법의모든영역 법모영. All rights reserved.
