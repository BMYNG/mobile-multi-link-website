<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1b382b">
<meta name="description" content="법모영 True Growth Lab — 일상 속 배움, 따뜻한 코칭, 함께하는 성장">
<title>법모영 | True Growth Lab</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          english: ['"Plus Jakarta Sans"', 'Georgia', 'sans-serif'],
        },
        colors: {
          forest: {
            50: '#f2f7f4',
            100: '#e1ede6',
            600: '#2d5a42',
            800: '#1e3d2d',
            900: '#142c20',
          },
          gold: {
            400: '#f3c768',
            500: '#e5b342',
          }
        },
        boxShadow: {
          'glass': '0 20px 40px -15px rgba(20, 44, 32, 0.08), 0 0 15px 0 rgba(255, 255, 255, 0.5) inset',
          'card': '0 10px 30px -5px rgba(20, 44, 32, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02)',
          'card-hover': '0 20px 35px -10px rgba(30, 61, 45, 0.15), 0 4px 12px -2px rgba(0, 0, 0, 0.05)',
        }
      }
    }
  }
</script>
<style>
  body {
    background: radial-gradient(circle at 50% 0%, #eef5f0 0%, #e2ebd8 60%, #d5e0cb 100%);
    background-attachment: fixed;
  }
  .glass-container {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .glass-card {
    background: rgba(255, 255, 255, 0.92);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .glass-card:hover {
    transform: translateY(-3px);
  }
  .hero-gradient {
    background: linear-gradient(135deg, #193527 0%, #29523c 50%, #35634a 100%);
  }
  /* Custom scrollbar */
  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-track {
    background: #eef5f0;
  }
  ::-webkit-scrollbar-thumb {
    background: #a3baa8;
    border-radius: 999px;
  }

  /* ADMIN MODE (hidden unless #admin) */
  #adminWrap[hidden]{display:none}
  .adm{font-size:14px;color:#24323c}
  .adm h2{margin:0 0 4px;font-size:17px;font-weight:800;color:#1e3d2d}
  .adm h3{margin:18px 0 8px;font-size:14px;font-weight:800;color:#2d5a42}
  .adm p{margin:0 0 10px;font-size:13px;color:#607080}
  .adm .row{display:grid;gap:8px;padding:12px;margin-bottom:10px;border:1px solid #dfe7e0;border-radius:12px;background:#fafcfa}
  .adm .fw{display:grid;gap:4px}
  .adm label{font-size:12px;color:#607080}
  .adm input,.adm select,.adm textarea{width:100%;padding:9px 10px;border:1px solid #cdd8ce;border-radius:8px;background:#fff;color:#24323c;font:inherit;font-size:14px}
  .adm input[type=file]{padding:6px;font-size:13px}
  .adm .tools{display:flex;gap:6px;flex-wrap:wrap}
  .adm button{font:inherit;font-size:13px;padding:9px 12px;border-radius:10px;border:1px solid #cdd8ce;background:#fff;color:#24323c;cursor:pointer}
  .adm button:disabled{opacity:.4;cursor:default}
  .adm button.primary{background:#1e3d2d;color:#fff;border-color:#1e3d2d}
  .adm button.del{color:#c0392b}
  #status{min-height:1.5em;font-size:13px;color:#607080;margin:8px 0 0}
</style>
</head>
<body class="font-sans text-slate-800 min-h-screen py-4 px-3 sm:py-8 sm:px-6 antialiased selection:bg-forest-100 selection:text-forest-900">

<div class="page max-w-[720px] mx-auto rounded-[28px] sm:rounded-[36px] overflow-hidden glass-container border border-white/80 shadow-glass">
  
  <!-- HERO HEADER -->
  <header class="hero hero-gradient relative overflow-hidden p-6 sm:p-10 text-white select-none">
    <!-- Decorative background circles -->
    <div class="absolute -right-20 -top-20 w-80 h-80 rounded-full border border-white/10 pointer-events-none"></div>
    <div class="absolute -right-10 -top-10 w-52 h-52 rounded-full border border-white/15 pointer-events-none"></div>
    <div class="absolute right-20 bottom-[-60px] w-40 h-40 rounded-full bg-emerald-400/10 blur-xl pointer-events-none"></div>

    <div class="relative z-10">
      <div class="brand flex items-center gap-4">
        <div class="logo grid place-items-center w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-white/10 border border-white/20 text-gold-400 shadow-inner backdrop-blur-md">
          <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21v-9"/>
            <path d="M12 14C5 14 3 9 4 4c5 0 9 3 8 10Z"/>
            <path d="M12 17c0-5 3-8 8-8 0 5-2 8-8 8Z"/>
          </svg>
        </div>
        <div>
          <h1 id="heroName" class="text-2xl sm:text-3xl font-extrabold tracking-tight leading-none text-white">법모영</h1>
          <div id="heroEn" class="english font-english text-xs sm:text-sm font-semibold text-gold-400 tracking-wider mt-1.5">True Growth Lab</div>
        </div>
      </div>

      <p id="heroMotto" class="motto text-emerald-50/90 text-sm sm:text-base leading-relaxed mt-6 font-normal">
        일상 속 배움, 따뜻한 코칭,<br class="hidden sm:inline"> 함께하는 성장
      </p>

      <div id="heroPillBox" class="mt-5 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/10 border border-white/20 backdrop-blur-md text-xs font-medium text-emerald-100 shadow-sm">
        <span class="w-2 h-2 rounded-full bg-gold-400 animate-pulse"></span>
        <span id="heroPill">배움과 성장을 잇는 교육 플랫폼</span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="p-5 sm:p-8 space-y-8" id="main"></main>

  <!-- FOOTER & AFFILIATE DISCLOSURE (PROMINENT CALLOUT) -->
  <footer class="p-6 sm:p-8 border-t border-slate-200/80 bg-slate-50/50 text-center">
    
    <!-- Prominent Affiliate Disclosure Banner -->
    <div id="disclBox" class="max-w-lg mx-auto mb-6 p-4 rounded-2xl text-amber-950 flex items-start gap-3 text-left">
      <span class="w-6 h-6 flex-none grid place-items-center rounded-full bg-amber-500 text-white text-xs font-black mt-0.5" aria-hidden="true">i</span>
      <p id="discl" class="text-xs leading-relaxed font-semibold">
        본 페이지는 각 제휴 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받을 수 있습니다.
      </p>
    </div>

    <p id="copyr" class="copyright text-xs font-bold text-slate-500">
      Copyright © 2026 법모영 · True Growth Lab
    </p>
  </footer>

</div>

<!-- MODAL POPUP -->
<div class="modal-backdrop fixed inset-0 z-50 p-4 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center transition-opacity" id="notice" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
  <div class="modal w-full max-w-sm rounded-3xl p-6 bg-white shadow-2xl border border-slate-100 transform transition-transform scale-95">
    <div class="modal-icon w-12 h-12 rounded-2xl bg-forest-50 text-forest-800 grid place-items-center mb-4 border border-forest-100" aria-hidden="true">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 11v5M12 7.5h.01"/>
      </svg>
    </div>
    <h2 id="modal-title" class="text-base font-bold text-slate-900 mb-2">자료 안내</h2>
    <p id="modal-message" class="text-xs text-slate-600 leading-relaxed min-h-[50px]"></p>
    <div class="modal-actions flex justify-end mt-5">
      <button id="close-modal" class="px-5 py-2.5 rounded-xl bg-forest-800 text-white text-xs font-bold hover:bg-forest-900 transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2" type="button">
        확인
      </button>
    </div>
  </div>
</div>


<!-- ADMIN MODE: 주소 끝에 #admin 을 붙여 열면 보입니다 -->
<div id="adminWrap" class="max-w-[720px] mx-auto mt-6 mb-10" hidden>
  <div class="adm rounded-[22px] bg-white/90 border border-dashed border-slate-400 p-4 sm:p-6">
    <h2>페이지 관리</h2>
    <p>내용을 고친 뒤 <b>HTML 파일 내려받기</b>를 눌러 호스팅에 다시 올리면 방문자 화면에 반영됩니다.</p>
    <div id="ed"></div>
    <div class="tools" style="margin-top:12px">
      <button type="button" id="dl" class="primary">HTML 파일 내려받기</button>
      <button type="button" id="copy">내용 복사</button>
      <button type="button" id="reset">처음으로</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </div>
</div>

/* ---------- modal (원본 그대로, 이벤트 위임만 사용) ---------- */
var modal=$("notice"),modalTitle=$("modal-title"),modalMessage=$("modal-message"),closeBtn=$("close-modal"),lastFocused=null;
function openModal(button){
  lastFocused=button;
  modalTitle.textContent=button.dataset.title||"자료 안내";
  modalMessage.textContent=button.dataset.message||"연결할 주소가 아직 등록되지 않았습니다.";
  modal.classList.remove("hidden");modal.classList.add("flex");
  setTimeout(function(){var m=modal.querySelector(".modal");m.classList.remove("scale-95");m.classList.add("scale-100")},10);
  closeBtn.focus();
}
function closeModal(){
  var m=modal.querySelector(".modal");m.classList.remove("scale-100");m.classList.add("scale-95");
  setTimeout(function(){modal.classList.remove("flex");modal.classList.add("hidden");if(lastFocused&&document.contains(lastFocused))lastFocused.focus()},150);
}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button[data-title]");if(b)openModal(b)});
closeBtn.addEventListener("click",closeModal);
modal.addEventListener("click",function(e){if(e.target===modal)closeModal()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!modal.classList.contains("hidden"))closeModal()});

/* ---------- 관리자 모드 ---------- */
var uid=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({base:BASE,data:data}))}catch(e){}}
function say(m){$("status").textContent=m}
function field(obj,k,label,o){
  o=o||{};var id="f"+(++uid),w=el("div","fw");
  var lab=el("label",null,label);lab.htmlFor=id;
  var i=document.createElement(o.multi?"textarea":"input");i.id=id;i.value=obj[k]||"";if(o.ph)i.placeholder=o.ph;if(o.multi)i.rows=2;
  i.addEventListener("input",function(){obj[k]=i.value;save();render()});
  w.appendChild(lab);w.appendChild(i);return w;
}
function select(obj,k,label,opts){
  var id="f"+(++uid),w=el("div","fw");
  var lab=el("label",null,label);lab.htmlFor=id;
  var s=document.createElement("select");s.id=id;
  opts.forEach(function(o){var op=el("option",null,o[1]);op.value=o[0];if((obj[k]||"")===o[0])op.selected=true;s.appendChild(op)});
  s.addEventListener("change",function(){obj[k]=s.value;save();render()});
  w.appendChild(lab);w.appendChild(s);return w;
}
function fileToData(file,W,keepPng,cb){
  var r=new FileReader();
  r.onerror=function(){say("파일을 읽지 못했습니다.")};
  r.onload=function(){
    var im=new Image();
    im.onerror=function(){say("이미지를 읽지 못했습니다. jpg 또는 png 파일인지 확인해 주세요.")};
    im.onload=function(){
      try{
        var sc=Math.min(1,W/im.width),w=Math.round(im.width*sc),h=Math.round(im.height*sc);
        var cv=document.createElement("canvas");cv.width=w;cv.height=h;
        var cx=cv.getContext("2d");
        if(!keepPng){cx.fillStyle="#fff";cx.fillRect(0,0,w,h)}
        cx.drawImage(im,0,0,w,h);
        cb(keepPng?cv.toDataURL("image/png"):cv.toDataURL("image/jpeg",0.85));
      }catch(e){say("이미지를 처리하지 못했습니다.")}
    };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}
function imgField(obj,k,label,W,keepPng){
  var w=el("div","fw");var isData=/^data:/i.test(obj[k]||"");
  w.appendChild(field({get v(){return isData?"":obj[k]},set v(x){obj[k]=x}},"v",label+" 주소 (https://...)",{ph:isData?"올린 이미지 사용 중":"https://"}));
  var id="f"+(++uid),lab=el("label",null,"또는 이미지 파일 올리기");lab.htmlFor=id;
  var fi=document.createElement("input");fi.type="file";fi.accept="image/*";fi.id=id;
  fi.addEventListener("change",function(){
    var f=fi.files&&fi.files[0];if(!f)return;say("이미지를 줄이는 중...");
    fileToData(f,W,keepPng,function(x){obj[k]=x;save();render();renderEditor();say("이미지를 넣었습니다.")});
  });
  w.appendChild(lab);w.appendChild(fi);
  if(obj[k]){var c=el("button",null,"이미지 지우기");c.type="button";c.onclick=function(){obj[k]="";save();render();renderEditor()};w.appendChild(c)}
  return w;
}
function move(arr,a,b){if(b<0||b>=arr.length)return;var t=arr[a];arr[a]=arr[b];arr[b]=t;save();render();renderEditor()}
function listEditor(host,arr,build,blank,addLabel){
  arr.forEach(function(it,i){
    var row=el("div","row");build(row,it);

    var rm=el("button","del","삭제");rm.type="button";rm.onclick=function(){arr.splice(i,1);save();render();renderEditor()};
    t.appendChild(up);t.appendChild(dn);t.appendChild(rm);row.appendChild(t);host.appendChild(row);
  });

function copyText(text,ok){
  var fail="복사에 실패했습니다. 직접 선택해서 복사해 주세요.";
  function fb(){var ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();var o=false;try{o=document.execCommand("copy")}catch(e){}ta.remove();return o}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(function(){say(ok)},function(){say(fb()?ok:fail)})}
  else{say(fb()?ok:fail)}
}
function download(){
  var url=location.href.split("#")[0];
  fetch(url).then(function(r){if(!r.ok)throw new Error("fetch");return r.text()}).then(function(t){
    var json=JSON.stringify(data).replace(/</g,"\\u003c");
    var re=/(<script id="seed" type="application\/json">)[\s\S]*?(<\/script>)/;
    if(!re.test(t))throw new Error("seed");
    var out=t.replace(re,function(m,a,b){return a+json+b});
    var blob=new Blob([out],{type:"text/html"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="index.html";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
    say("index.html을 내려받았습니다. 호스팅에 다시 올려 주세요.");
  }).catch(function(){say("이 화면에서는 파일 내려받기가 안 됩니다. 발행한 주소 끝에 #admin을 붙여 열어 주세요.")});
}
function stripData(o){var n=0;(function w(x){if(x&&typeof x==="object"){Object.keys(x).forEach(function(k){if(typeof x[k]==="string"&&/^data:image/i.test(x[k])){x[k]="";n++}else w(x[k])})}})(o);return n}
function setupAdmin(){
  $("adminWrap").hidden=false;
  if(adminReady)return;adminReady=true;
  try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(p&&p.base===BASE&&p.data)data=p.data}}catch(e){}
  $("dl").onclick=download;
  $("reset").onclick=function(){data=clone(seed);save();render();renderEditor();say("처음 상태로 되돌렸습니다.")};
  $("copy").onclick=function(){var d=clone(data),n=stripData(d);copyText(JSON.stringify(d,null,2),n?"복사했습니다. (올린 이미지 "+n+"장은 빠집니다. 이미지는 파일 내려받기를 이용해 주세요.)":"복사했습니다.")};
  render();renderEditor();
}
