<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>법모영 영어교습소 · 링크</title>
<meta name="description" content="일상 속 배움, 따뜻한 코칭의 시작">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Playfair+Display:wght@500&display=swap">
<style>
:root{
  --bg:#f5f3ee;--card:#ffffff;--ink:#111111;--sub:#686868;--line:#e6e1d6;--sand:#ebdcc7;
  --feat-bg:#111111;--feat-ink:#ffffff;--feat-sub:#b9b9b9;--danger:#a13e4e;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--card:#201f1d;--ink:#f3f0e8;--sub:#a9a59b;--line:#33312d;--sand:#3a342a;
  --feat-bg:#f3f0e8;--feat-ink:#111111;--feat-sub:#555555;--danger:#e08a98;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413;--card:#201f1d;--ink:#f3f0e8;--sub:#a9a59b;--line:#33312d;--sand:#3a342a;
  --feat-bg:#f3f0e8;--feat-ink:#111111;--feat-sub:#555555;--danger:#e08a98;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:40px 20px 32px}
.avatar{width:92px;height:92px;border-radius:50%;margin:0 auto 16px;background:var(--feat-bg);color:var(--feat-ink);display:grid;place-items:center;font-family:"Playfair Display",Georgia,serif;font-size:44px;box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--line)}
h1{margin:0;text-align:center;font-size:20px;font-weight:600;letter-spacing:-.01em}
.role{margin:2px 0 0;text-align:center;color:var(--sub);font-size:14px}
.bio{margin:14px auto 28px;text-align:center;color:var(--sub);font-size:14px;max-width:30ch}
.list{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{border-color:var(--sub)}.card:active{transform:scale(.985)}
.card:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card.feat{background:var(--feat-bg);color:var(--feat-ink);border-color:var(--feat-bg);padding:18px 16px}
.ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--sand);display:grid;place-items:center;font-weight:600;font-size:17px;color:var(--ink)}
.feat .ico{background:rgba(255,255,255,.14);color:var(--feat-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .feat .ico{background:rgba(0,0,0,.1)}}
.txt{flex:1;min-width:0}
.t{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feat .d{color:var(--feat-sub)}
.arr{flex:none;opacity:.5}
.empty{text-align:center;color:var(--sub);padding:24px 0}
footer{margin-top:32px;text-align:center;color:var(--sub);font-size:12px}
/* admin */
.admin{display:none;margin-top:28px;padding:16px;border:1px dashed var(--sub);border-radius:16px;background:var(--card)}
body.is-admin .admin{display:block}
.admin h2{margin:0 0 4px;font-size:16px}
.admin p{margin:0 0 12px;font-size:13px;color:var(--sub)}
.row{display:grid;gap:6px;padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px}
.row input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.row label{font-size:12px;color:var(--sub)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:13px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--feat-bg);color:var(--feat-ink);border-color:var(--feat-bg)}
button.del{color:var(--danger)}
#status{min-height:1.5em;font-size:13px;color:var(--sub);margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="avatar" aria-hidden="true">B</div>
    <h1>법모영 영어교습소</h1>
    <p class="role">원장 선종필</p>
    <p class="bio">일상 속 배움, 따뜻한 코칭의 시작</p>
  </header>

  <main><ul class="list" id="list"></ul></main>

  <section class="admin" id="admin" aria-label="링크 관리">
    <h2>링크 관리</h2>
    <p>수정한 뒤 <b>내용 복사</b>를 눌러 Claude에게 붙여넣으면 공개 페이지에 반영해 드립니다. 이 화면은 주소 끝에 #admin이 있을 때만 보입니다.</p>
    <div id="editor"></div>
    <div class="tools">
      <button type="button" id="add">+ 링크 추가</button>
      <button type="button" id="copy" class="primary">내용 복사</button>
      <button type="button" id="reset">처음으로</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <footer>© 법모영 영어교습소</footer>
</div>

<script>
(function(){
"use strict";
var DEFAULT_LINKS=[
  {title:"네이버 블로그",desc:"교육 정보와 학습 자료",url:"https://m.blog.naver.com/9812014sun",icon:"N"},
  {title:"인스타그램",desc:"교습소의 일상과 소식",url:"https://www.instagram.com/b3opmoyng",icon:"IG"},
  {title:"스레드",desc:"짧은 글과 생각",url:"https://www.threads.com/@b3opmoyng",icon:"@"},
  {title:"티스토리",desc:"더 많은 글 읽기",url:"https://bubmoy.tistory.com",icon:"T"},
  {title:"X (트위터)",desc:"새 소식 받아보기",url:"https://x.com/bubmoy19279",icon:"X"}
];
var KEY="multilink-draft-v1";
var isAdmin=location.hash==="#admin";
var links=DEFAULT_LINKS.map(function(l){return Object.assign({},l)});

if(isAdmin){
  try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(Array.isArray(p))links=p}}catch(e){}
  document.body.classList.add("is-admin");
}

var list=document.getElementById("list");
var editor=document.getElementById("editor");
var statusEl=document.getElementById("status");

function safeUrl(u){
  u=(u||"").trim();
  if(!u)return"";
  if(!/^https?:\/\//i.test(u))u="https://"+u;
  try{var x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:""}catch(e){return""}
}
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}

function render(){
  list.textContent="";
  var shown=links.filter(function(l){return l.title&&safeUrl(l.url)});
  if(!shown.length){list.appendChild(el("li","empty","아직 등록된 링크가 없습니다."));return}
  shown.forEach(function(l,i){
    var li=document.createElement("li");
    var a=el("a","card"+(i===0?" feat":""));
    a.href=safeUrl(l.url);a.target="_blank";a.rel="noopener noreferrer";
    a.appendChild(el("span","ico",l.icon||(l.title||"").charAt(0)));
    var t=el("span","txt");
    t.appendChild(el("div","t",l.title));
    if(l.desc)t.appendChild(el("div","d",l.desc));
    a.appendChild(t);
    var arr=el("span","arr","›");arr.setAttribute("aria-hidden","true");
    a.appendChild(arr);
    li.appendChild(a);list.appendChild(li);
  });
}

function save(){try{localStorage.setItem(KEY,JSON.stringify(links))}catch(e){}}
function say(m){statusEl.textContent=m}

function field(labelText,id,value,onInput){
  var wrap=el("div");
  var lab=el("label",null,labelText);lab.htmlFor=id;
  var inp=document.createElement("input");inp.id=id;inp.value=value||"";
  inp.addEventListener("input",function(){onInput(inp.value);save();render()});
  wrap.appendChild(lab);wrap.appendChild(inp);return wrap;
}
function renderEditor(){
  editor.textContent="";
  links.forEach(function(l,i){
    var row=el("div","row");
    row.appendChild(field("제목","t"+i,l.title,function(v){l.title=v}));
    row.appendChild(field("주소","u"+i,l.url,function(v){l.url=v}));
    row.appendChild(field("설명","d"+i,l.desc,function(v){l.desc=v}));
    var tools=el("div","tools");
    var up=el("button",null,"↑ 위로");up.type="button";up.disabled=i===0;
    var dn=el("button",null,"↓ 아래로");dn.type="button";dn.disabled=i===links.length-1;
    var rm=el("button","del","삭제");rm.type="button";
    up.onclick=function(){swap(i,i-1)};dn.onclick=function(){swap(i,i+1)};
    rm.onclick=function(){links.splice(i,1);save();render();renderEditor()};
    tools.appendChild(up);tools.appendChild(dn);tools.appendChild(rm);
    row.appendChild(tools);editor.appendChild(row);
  });
}
function swap(a,b){if(b<0||b>=links.length)return;var t=links[a];links[a]=links[b];links[b]=t;save();render();renderEditor()}

if(isAdmin){
  document.getElementById("add").onclick=function(){links.push({title:"",desc:"",url:""});save();renderEditor();say("새 링크 칸을 추가했습니다.")};
  document.getElementById("reset").onclick=function(){links=DEFAULT_LINKS.map(function(l){return Object.assign({},l)});save();render();renderEditor();say("처음 상태로 되돌렸습니다.")};
  document.getElementById("copy").onclick=function(){
    var data=JSON.stringify(links.filter(function(l){return l.title&&safeUrl(l.url)}).map(function(l){return{title:l.title,desc:l.desc||"",url:safeUrl(l.url),icon:l.icon||l.title.charAt(0)}}),null,2);
    function fallback(){
      var ta=document.createElement("textarea");ta.value=data;ta.setAttribute("readonly","");
      ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();
      var ok=false;try{ok=document.execCommand("copy")}catch(e){}
      ta.remove();return ok;
    }
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(data).then(function(){say("복사했습니다. Claude에게 붙여넣어 주세요.")},function(){say(fallback()?"복사했습니다. Claude에게 붙여넣어 주세요.":"복사에 실패했습니다. 직접 선택해서 복사해 주세요.")});
    }else{say(fallback()?"복사했습니다. Claude에게 붙여넣어 주세요.":"복사에 실패했습니다. 직접 선택해서 복사해 주세요.")}
  };
  renderEditor();
}
render();
})();
</script>
</body>
</html>
